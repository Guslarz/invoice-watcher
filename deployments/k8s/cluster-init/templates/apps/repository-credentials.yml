apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-repository-credentials
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-init-secrets
  target:
    name: github-repository-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: {{ required "github.orgUrl is required" .Values.github.orgUrl }}
        username: {{ required "github.username is required" .Values.github.username }}
        password: "{{`{{ .pat }}`}}"
  data:
    - secretKey: pat
      remoteRef:
        key: github-pat-secret
        property: pat
