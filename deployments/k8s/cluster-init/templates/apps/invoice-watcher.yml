apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 'invoice-watcher-{{ required "environment is required" .Values.environment }}'
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: '{{ required "github.orgUrl is required" .Values.github.orgUrl }}/invoice-watcher.git'
    targetRevision: HEAD
    path: 'deployments/k8s-apps/environments/{{ required "environment is required" .Values.environment }}'
  destination:
    server: https://kubernetes.default.svc
    namespace: 'invoice-watcher-{{ required "environment is required" .Values.environment }}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
