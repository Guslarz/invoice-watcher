apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: domain-cert
spec:
  secretName: domain-cert-secret
  dnsNames:
    - "*.{{ required "domain is required" .Values.domain }}"
  duration: 168h
  renewBefore: 24h
  issuerRef:
    group: cert-manager.k8s.cloudflare.com
    kind: OriginIssuer
    name: domain-cert-issuer
