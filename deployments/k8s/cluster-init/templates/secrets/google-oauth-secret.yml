apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: google-oauth-secret-provider
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcpProjectNumber is required" .Values.gcpProjectNumber }}/secrets/google_oauth/versions/latest"
        path: key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: google-oauth-secret
spec:
  serviceAccountName: secret-sync-sa
  secretProviderClassName: google-oauth-secret-provider
  secretObject:
    type: Opaque
    data:
      - sourcePath: key
        targetKey: key
