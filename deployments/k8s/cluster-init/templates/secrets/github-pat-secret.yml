apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: github-pat-secret-provider
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcpProjectNumber is required" .Values.gcpProjectNumber }}/secrets/github_pat/versions/latest"
        path: pat
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: github-pat-secret
spec:
  serviceAccountName: secret-sync-sa
  secretProviderClassName: github-pat-secret-provider
  secretObject:
    type: Opaque
    data:
      - sourcePath: pat
        targetKey: pat
