apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aes-key-secret-provider
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.gcpProjectNumber }}/secrets/aes_key/versions/latest"
        path: key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: aes-key-secret
spec:
  serviceAccountName: secret-sync-sa
  secretProviderClassName: aes-key-secret-provider
  secretObject:
    type: Opaque
    data:
      - sourcePath: key
        targetKey: key
