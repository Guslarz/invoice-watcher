apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudflare-api-token-secret-provider
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ required "gcpProjectNumber is required" .Values.gcpProjectNumber }}/secrets/cloudflare_api_token/versions/latest"
        path: key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: cloudflare-api-token-secret
spec:
  serviceAccountName: secret-sync-sa
  secretProviderClassName: cloudflare-api-token-secret-provider
  secretObject:
    type: Opaque
    data:
      - sourcePath: key
        targetKey: key
