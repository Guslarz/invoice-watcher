apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - service-account.yml
  - image-pull-secret.yml
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/database-access=true
    patch: |
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: app-sa
