apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-producer-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-init-secrets
  target:
    name: mail-producer-secret
    template:
      data:
        INVOICE_WATCHER_ATTACHMENT_STORAGE_GCS_BUCKET: "{{ .attachmentBucket }}"
        INVOICE_WATCHER_MAIL_ATTACHMENT_DAO_FIRESTORE_PROJECT_ID: "{{ .attachmentProject }}"
        INVOICE_WATCHER_SECRET_AES_KEY: "{{ .aes }}"
        INVOICE_WATCHER_OAUTH_GOOGLE_CLIENT_ID: '{{ (fromJson .google).client_id }}'
        INVOICE_WATCHER_OAUTH_GOOGLE_CLIENT_SECRET: '{{ (fromJson .google).client_secret }}'
  data:
    - secretKey: aes
      remoteRef:
        key: aes-key-secret
        property: key
    - secretKey: google
      remoteRef:
        key: google-oauth-secret
        property: key
    - secretKey: attachmentBucket
      remoteRef:
        key: attachment-cloud-config
        property: bucket
    - secretKey: attachmentProject
      remoteRef:
        key: attachment-cloud-config
        property: projectId
