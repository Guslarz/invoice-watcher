apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: invoice-watcher/user-registration-backend
    newName: ghcr.io/guslarz/invoice-watcher/user-registration-backend
    newTag: snapshot
patches:
  - path: deployment-version-patch.yml
    target:
      kind: Deployment
  - path: image-pull-policy-patch.yml
    target:
      kind: Deployment
configMapGenerator:
  - name: user-registration-backend-env-config-map
    behavior: create
    envs:
      - config/.env
