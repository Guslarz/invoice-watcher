apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-registration-backend-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-init-secrets
  target:
    name: user-registration-backend-secret
    template:
      data:
        INVOICE_WATCHER_SECRET_AES_KEY: "{{ .aes }}"
        INVOICE_WATCHER_GOOGLE_OAUTH_CLIENT_ID: '{{ (fromJson .google).client_id }}'
        INVOICE_WATCHER_GOOGLE_OAUTH_CLIENT_SECRET: '{{ (fromJson .google).client_secret }}'
  data:
    - secretKey: aes
      remoteRef:
        key: aes-key-secret
        property: key
    - secretKey: google
      remoteRef:
        key: google-oauth-secret
        property: key
