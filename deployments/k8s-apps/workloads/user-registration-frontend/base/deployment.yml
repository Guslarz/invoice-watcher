apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-registration-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-registration-frontend
  template:
    metadata:
      labels:
        app: user-registration-frontend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-image-pull-secret
      containers:
        - name: user-registration-frontend
          image: invoice-watcher/user-registration-frontend
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
