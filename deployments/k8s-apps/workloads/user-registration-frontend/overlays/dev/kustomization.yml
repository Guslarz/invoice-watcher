apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: invoice-watcher/user-registration-frontend
    newName: ghcr.io/guslarz/invoice-watcher/user-registration-frontend
    newTag: snapshot
patches:
  - path: deployment-version-patch.yml
    target:
      kind: Deployment
  - path: image-pull-policy-patch.yml
    target:
      kind: Deployment
