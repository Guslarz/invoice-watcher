apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prepare-topics
          image: apache/kafka:4.3.1
          command: ["/bin/bash", "/policy/prepare-topics.sh"]
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: policy
          configMap:
            name: kafka-topic-policy
