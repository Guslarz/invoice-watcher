apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mail-producer-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-init-secrets
  target:
    name: mail-producer-secret
  data:
    - secretKey: INVOICE_WATCHER_SECRET_AES_KEY
      remoteRef:
        key: aes-key-secret
        property: key
