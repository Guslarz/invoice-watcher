apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        version: 4.3.1
    spec:
      containers:
        - name: mail-producer
          image: apache/kafka:4.3.1
          envFrom:
            - configMapRef:
                name: kafka-env-config-map
          ports:
            - containerPort: 9092
            - containerPort: 9093
