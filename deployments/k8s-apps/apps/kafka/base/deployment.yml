apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        version: 4.3.1
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          envFrom:
            - configMapRef:
                name: kafka-env-config-map
          ports:
            - containerPort: 9092
            - containerPort: 9093
          startupProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9092
          readinessProbe:
            tcpSocket:
              port: 9092
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1Gi
