apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-registration-backend
  labels:
    app.kubernetes.io/database-access: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-registration-backend
  template:
    metadata:
      labels:
        app: user-registration-backend
    spec:
      serviceAccountName: app-sa
      containers:
        - name: user-registration-backend
          image: invoice-watcher/user-registration-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=60
          envFrom:
            - configMapRef:
                name: user-registration-backend-env-config-map
            - secretRef:
                name: user-registration-backend-secret
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
