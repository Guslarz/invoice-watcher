apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: invoice-watcher/mail-producer
    newName: ghcr.io/guslarz/invoice-watcher/mail-producer-docker
    newTag: snapshot
configMapGenerator:
  - name: mail-producer-env-config-map
    behavior: create
    envs:
      - config/.env
