apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: image-pull-secret-provider
  namespace: ${namespace}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${gcp_project_number}/secrets/${ghcr_docker_config_json_secret_name}/versions/latest"
        path: ".dockerconfigjson"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: image-pull-secret
  namespace: ${namespace}
spec:
  serviceAccountName: ${sa_name}
  secretProviderClassName: image-pull-secret-provider
  secretObject:
    type: kubernetes.io/dockerconfigjson
    data:
      - sourcePath: ".dockerconfigjson"
        targetKey: .dockerconfigjson
