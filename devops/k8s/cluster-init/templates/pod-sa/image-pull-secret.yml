apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ghcr-image-pull-secret-provider
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.gcpProjectNumber }}/secrets/ghcr_docker_config_json/versions/latest"
        path: ".dockerconfigjson"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: ghcr-image-pull-secret
spec:
  serviceAccountName: pod-sa
  secretProviderClassName: ghcr-image-pull-secret-provider
  secretObject:
    type: kubernetes.io/dockerconfigjson
    data:
      - sourcePath: ".dockerconfigjson"
        targetKey: .dockerconfigjson
