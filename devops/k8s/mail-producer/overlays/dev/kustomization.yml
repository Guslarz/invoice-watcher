apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: invoice-watcher/mail-producer
    newName: ghcr.io/guslarz/invoice-watcher/mail-producer-docker
    newTag: snapshot
patches:
  - path: deployment-version-patch.yml
    target:
      kind: Deployment
  - path: image-pull-policy-patch.yml
    target:
      kind: Deployment
  - path: application-version-patch.yml
    target:
      kind: Application
configMapGenerator:
  - name: mail-producer-env-config-map
    behavior: create
    envs:
      - config/.env
