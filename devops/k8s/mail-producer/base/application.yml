apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: "mail-producer"
  namespace: "invoice-watcher"
  labels:
    app.kubernetes.io/name: "mail-producer"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "mail-producer"
  componentKinds:
    - group: apps
      kind: StatefulSet
  descriptor:
    type: "kafka-producer"
