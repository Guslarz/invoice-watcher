apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-image-pull-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-init-secrets
  target:
    name: ghcr-image-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" "Guslarz" .pat | b64enc }}"}}}
  data:
    - secretKey: pat
      remoteRef:
        key: github-pat-secret
        property: pat
