# Temporary security overrides. Review on dependency updates per docs/agents/guidelines/build-and-release.md.
# Spring Boot Gradle plugin buildpack tooling (GHSA-j288-q9x7-2f5v).
commons-lang3 = "3.21.0"
# Spring Cloud GCP application dependencies and Checkstyle (GHSA-xxph-c9ww-hj94).
guava = "33.7.2-jre"
# Node Gradle plugin's Jackson 2 core and databind (including GHSA-7hhh-6rmp-j9qf and GHSA-cxp5-3px4-pw24).
jackson2 = "2.21.8"
# Kafka clients on application and test runtimes (GHSA-mcr4-qmvw-px4g, GHSA-343h-94h5-c4wr, GHSA-gm45-99xc-r7wv).
lz4-java = "1.11.4"
# Checkstyle's Doxia dependency chain (GHSA-6fmv-xxpf-w3cw).
plexus-utils = "3.6.1"
# Kafka clients on application and test runtimes (GHSA-gwq9-9ffj-mvrv, GHSA-xqrx-qh46-34m7, GHSA-q233-g92q-qxp6).
snappy-java = "1.1.10.9"

