spring:
  jpa:
    open-in-view: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  cloud:
    gcp:
      sql:
        enabled: false
      datastore:
        enabled: false
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${invoice-watcher.user-registration.secure-cookies:true}
management:
  endpoint:
    health:
      probes:
        enabled: true
