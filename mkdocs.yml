site_name: InvoiceWatcher
site_description: Watches mailboxes and turns incoming e-mails into events for invoice processing.
site_url: https://guslarz.github.io/invoice-watcher/
repo_url: https://github.com/Guslarz/invoice-watcher
repo_name: Guslarz/invoice-watcher
edit_uri: edit/master/docs/

# Agent and contributor material (specs, ADRs, protocols) lives in docs/agents and is not published.
exclude_docs: |
  agents/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - System:
      - system/index.md
      - system/architecture.md
  - Setup:
      - setup/index.md
      - setup/one-time.md
      - setup/environment.md
      - setup/keys-and-users.md
      - setup/local.md
  - In action:
      - results/index.md
  - Reference:
      - reference/index.md
      # Generated by scripts/verify.sh (scripts/gen-reference.py)
      - reference/configuration.md
      - reference/cli.md
      - reference/modules.md
