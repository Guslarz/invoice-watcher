[project]
site_name = "InvoiceWatcher"
site_description = "Watches mailboxes and turns incoming e-mails into events for invoice processing."
site_url = "https://guslarz.github.io/invoice-watcher/"
repo_url = "https://github.com/Guslarz/invoice-watcher"
repo_name = "Guslarz/invoice-watcher"
edit_uri = "edit/master/docs/"

# Agent and contributor material (specs, ADRs, protocols) lives in docs/agents and is not published.
exclude_docs = """
agents/
"""

nav = [
  { "Home" = "index.md" },
  { "System" = [
    "system/index.md",
    "system/architecture.md",
  ] },
  { "Setup" = [
    "setup/index.md",
    "setup/one-time.md",
    "setup/environment.md",
    "setup/keys-and-users.md",
    "setup/local.md",
  ] },
  { "In action" = [
    "results/index.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    # Generated by scripts/verify.sh (scripts/gen-reference.py)
    "reference/configuration.md",
    "reference/cli.md",
    "reference/modules.md",
  ] },
]

# Mermaid with the elk layout and click-to-enlarge diagrams
extra_javascript = [{ path = "javascripts/mermaid.mjs", type = "module" }]
extra_css = ["stylesheets/mermaid.css"]

[project.theme]
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
