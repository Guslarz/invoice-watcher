name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment type (major, minor, patch)
        type: choice
        required: true
        default: minor
        options: [major, minor, patch]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle

      - name: Configure release commit identity
        run: |
          git config user.name 'Release automation'
          git config user.email 'release@users.noreply.github.com'

      - name: Commit release, tag it and restore development
        id: prepare
        env:
          SOURCE: ${{ github.sha }}
          INCREMENT: ${{ inputs.version_increment }}
        run: python3 scripts/release.py --source "$SOURCE" --increment "$INCREMENT"

      - name: Build and publish tagged artifacts
        uses: ./.github/actions/gradle-publish
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --title "Release v$VERSION" --verify-tag
          fi
