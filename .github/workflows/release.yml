name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment type (major, minor, patch)
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle

      - name: Set environment variables
        run: |
          declare -A INCREMENT_MAP=( ["major"]="incrementMajor" ["minor"]="incrementMinor" ["patch"]="incrementPatch" )
          echo "VERSION_INCREMENT=${INCREMENT_MAP[${{ inputs.version_increment }}]}" >> "$GITHUB_ENV"

      - name: Increment version
        run: |
          ./gradlew release \
            -Prelease.versionIncrementer=${{ env.VERSION_INCREMENT }} \
            -Prelease.customUsername=${{ github.actor }} \
            -Prelease.customPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish artifacts
        uses: ./.github/actions/gradle-publish
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        run: echo "CURRENT_VERSION=$(./gradlew cV -q -Prelease.quiet)" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$CURRENT_VERSION" --title "Release v$CURRENT_VERSION" --verify-tag
