name: Release

on:
  workflow_dispatch:
    inputs:
      version_increment:
        description: Version increment type (major, minor, patch)
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set environmental variables
        run: |
          declare -A INCREMENT_MAP=( ["major"]="incrementMajor" ["minor"]="incrementMinor" ["patch"]="incrementPatch" )
          echo "VERSION_INCREMENT=${INCREMENT_MAP[${{ github.event.inputs.version_increment }}]}" >> $GITHUB_ENV
      - name: Increment version
        run: |
          ./gradlew release \
            -Prelease.versionIncrementer=${{ env.VERSION_INCREMENT }} \
            -Prelease.username=${{ github.actor }} \
            -Prelease.customKeyPassword=${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish artifacts
        run: |
          ./gradlew build analyze publish \
            -Pcom.guslarz.invoicewatcher.docker.registry=ghcr.io \
            -Pcom.guslarz.invoicewatcher.docker.namespace=guslarz/invoice-watcher \
            -Pcom.guslarz.invoicewatcher.docker.username=${{ github.actor }} \
            -Pcom.guslarz.invoicewatcher.docker.password=${{ secrets.GITHUB_TOKEN }}
      - name: Get current version
        run: echo "CURRENT_VERSION=$(./gradlew cV -q -Prelease.quiet)" >> $GITHUB_ENV
      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ env.CURRENT_VERSION }}
          release_name: Release v${{ env.CURRENT_VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
