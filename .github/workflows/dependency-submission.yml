name: Dependency Submission

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]
    paths:
      - '.github/workflows/dependency-submission.yml'
      - '.github/workflows/docs.yml'
      - '.github/actions/**'
      - '.run/files/**'
      - 'deployments/k8s-apps/**'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.Dockerfile'
      - '**/src/test/**/*.java'
      - 'frontend/.node-version'
      - 'frontend/package.json'
      - 'requirements-docs.txt'
      - 'scripts/dependency-snapshot.py'
      - 'scripts/tests/test_dependency_snapshot.py'

permissions:
  contents: read

jobs:
  dependency-submission:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: ./.github/actions/setup-gradle
        with:
          gradle: 'false'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  supplemental-snapshot:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Resolve documentation dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-venv"
          "$RUNNER_TEMP/dependency-venv/bin/python" -m pip install \
            --report "$RUNNER_TEMP/docs-dependencies.json" -r requirements-docs.txt

      - name: Verify and generate supplemental snapshot
        run: |
          "$RUNNER_TEMP/dependency-venv/bin/python" -m unittest discover \
            -s scripts/tests -p test_dependency_snapshot.py
          "$RUNNER_TEMP/dependency-venv/bin/python" scripts/dependency-snapshot.py \
            --pip-report "$RUNNER_TEMP/docs-dependencies.json" \
            --output "$RUNNER_TEMP/supplemental-dependencies.json"

      - name: Upload supplemental snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supplemental-dependencies
          path: ${{ runner.temp }}/supplemental-dependencies.json
          if-no-files-found: error

  submit-supplemental-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: supplemental-snapshot
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download supplemental snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: supplemental-dependencies

      - name: Submit supplemental snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input supplemental-dependencies.json
