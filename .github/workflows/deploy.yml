name: Deploy
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to get deployments from
        type: string
        required: true
        default: master
      environment:
        description: Environment (dev)
        type: choice
        required: true
        default: dev
        options:
          - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          location: ${{ vars.GCP_ZONE }}

      - name: Deploy to GKE
        run: |-
          kubectl apply -k devops/deployments/kafka/overlays/${{ github.event.inputs.environment }}
          kubectl apply -k devops/deployments/mail-producer/overlays/${{ github.event.inputs.environment }}
