name: Environment
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (up, down)
        type: choice
        required: true
        default: up
        options:
          - up
          - down
      environment:
        description: Environment
        type: choice
        required: true
        default: dev
        options:
          - dev

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure-up:
    if: ${{ github.event.inputs.action == 'up' }}
    uses: ./.github/workflows/infrastructure.yml
    strategy:
      max-parallel: 1
      matrix:
        action: [ up ]
        module: [ persistent, ephemereal ]
    with:
      action: ${{ matrix.action }}
      environment: ${{ github.event.inputs.environment }}
      module: ${{ matrix.module }}
    secrets:
      PAT: ${{ secrets.PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  infrastructure-down:
    if: ${{ github.event.inputs.action == 'down' }}
    uses: ./.github/workflows/infrastructure.yml
    with:
      action: down
      environment: ${{ github.event.inputs.environment }}
      module: ephemereal
    secrets:
      PAT: ${{ secrets.PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  k8s-install:
    if: ${{ github.event.inputs.action == 'up' }}
    uses: ./.github/workflows/k8s-install.yml
    needs: infrastructure-up
    with:
      environment: ${{ github.event.inputs.environment }}
