name: Environment
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (up, down)
        type: choice
        required: true
        default: up
        options:
          - up
          - down
      environment:
        description: Environment
        type: choice
        required: true
        default: dev
        options:
          - dev

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    uses: ./.github/workflows/infrastructure.yml
    with:
      action: ${{ github.event.inputs.action }}
      environment: ${{ github.event.inputs.environment }}
      module: ephemereal
    secrets:
      PAT: ${{ secrets.PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  k8s-install:
    if: ${{ github.event.inputs.action == 'up' }}
    uses: ./.github/workflows/k8s-install.yml
    needs: infrastructure
    with:
      environment: ${{ github.event.inputs.environment }}
