name: Build and analyze

on:
  pull_request:

jobs:
  # Documentation-only changes (everything under docs/) skip the Gradle build but still check the
  # generated reference (it runs Gradle too); changes outside deployments/ and .github/workflows/ skip the
  # deployment file checks (the workflows share names with the deployment files)
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deployments: ${{ steps.diff.outputs.deployments }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # HEAD is the pull request merge commit, HEAD^1 the tip of the base branch
      - name: Detect changes outside docs/ and in deployments/ or .github/workflows/
        id: diff
        run: |
          outside_docs=$(git diff --name-only HEAD^1 HEAD | grep -cv '^docs/' || true)
          if [ "$outside_docs" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          in_deployments=$(git diff --name-only HEAD^1 HEAD | grep -cE '^(deployments|\.github/workflows)/' || true)
          if [ "$in_deployments" -gt 0 ]; then
            echo "deployments=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployments=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle

      - name: Build with Gradle
        run: ./gradlew build analyze

  deployments:
    needs: changes
    if: needs.changes.outputs.deployments == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu and helmfile
        uses: ./.github/actions/setup-deploy-tools

      - name: Setup kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf kubeconform.tar.gz -C "$RUNNER_TEMP/bin" kubeconform
          rm kubeconform.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check deployment files
        run: scripts/check-deployments.sh

  reference:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-gradle

      # docs/reference/ is generated from code and committed with the change (scripts/verify.sh)
      - name: Check generated reference is up to date
        run: |
          scripts/gen-reference.sh
          if [ -n "$(git status --porcelain -- docs/reference)" ]; then
            git status --short -- docs/reference
            git diff -- docs/reference
            echo "::error::docs/reference is out of date - run scripts/verify.sh and commit the result"
            exit 1
          fi

      - name: Check overlay environment variables bind to properties
        run: scripts/check-env-bindings.sh
