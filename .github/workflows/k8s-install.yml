name: K8s install
on:
  workflow_call:
    inputs:
      environment:
        description: Environment (dev)
        type: string
        required: true

jobs:
  k8s-install:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read installation location
        id: installation
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          file="deployments/installations/$ENVIRONMENT.json"
          echo "cluster=$(jq -r .cluster_name "$file")" >> "$GITHUB_OUTPUT"
          echo "zone=$(jq -r .zone "$file")" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project-id: ${{ vars.GCP_PROJECT_ID }}
          project-number: ${{ vars.GCP_PROJECT_NUMBER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Wait for GKE cluster
        timeout-minutes: 5
        run: |
          until [ "$(gcloud container clusters describe "$CLUSTER" --location "$LOCATION" \
                      --format='value(status)' 2>/dev/null)" = "RUNNING" ]; do
            echo "Cluster not ready yet, retrying in 30s..."
            sleep 30
          done
        env:
          CLUSTER: ${{ steps.installation.outputs.cluster }}
          LOCATION: ${{ steps.installation.outputs.zone }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ steps.installation.outputs.cluster }}
          location: ${{ steps.installation.outputs.zone }}

      - name: Setup helmfile
        uses: ./.github/actions/setup-deploy-tools
        with:
          tofu: 'false'

      # sync, not apply: helm-diff is installed, but apply would only use it to decide what to sync
      - name: Install cluster services
        working-directory: ./deployments/k8s
        run: helmfile --environment "$ENVIRONMENT" sync
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
