name: Infrastructure
on:
  workflow_call:
    inputs:
      action:
        description: Action (up, down)
        type: string
        required: true
      environment:
        description: Environment
        type: string
        required: true
      module:
        description: Module
        type: string
        required: true
    secrets:
      PAT:
        description: GitHub Personal Access Token
        required: true
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API Token
        required: true

jobs:
  opentofu:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./deployments/infrastructure/environments/${{ inputs.environment }}/${{ inputs.module }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set environmental variables
        run: |
          declare -A ACTION_MAP=( ["up"]="apply" ["down"]="destroy" )
          echo "ACTION=${ACTION_MAP[${{ inputs.action }}]}" >> $GITHUB_ENV

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.5'

      - name: Setup variables
        run: |-
          cat > terraform.tfvars <<EOF
          gcp_project_id="${{ vars.GCP_PROJECT_ID }}"
          gcp_project_number="${{ vars.GCP_PROJECT_NUMBER }}"
          github_pat="${{ secrets.PAT }}"
          cloudflare_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          cloudflare_zone_id="${{ vars.CLOUDFLARE_ZONE_ID }}"
          EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-actions@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Tofu Init
        run: tofu init -input=false

      - name: Tofu Plan
        run: tofu plan -input=false

      - name: Tofu action
        run: tofu ${{ env.ACTION }} -auto-approve -input=false
