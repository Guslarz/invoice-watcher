name: Infrastructure
on:
  workflow_call:
    inputs:
      action:
        description: Action (up, down)
        type: string
        required: true
      environment:
        description: Environment
        type: string
        required: true
      module:
        description: Module
        type: string
        required: true
    secrets:
      PAT:
        description: GitHub Personal Access Token
        required: true
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API Token
        required: true
      AES_KEY:
        description: AES key that decrypts mailbox passwords
        required: true

jobs:
  opentofu:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./deployments/infrastructure/environments/${{ inputs.environment }}/${{ inputs.module }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        if: ${{ inputs.action == 'up' }}
        env:
          AES_KEY: ${{ secrets.AES_KEY }}
          PAT: ${{ secrets.PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for secret in AES_KEY PAT CLOUDFLARE_API_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret secret is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set environment variables
        run: |
          declare -A PLAN_FLAGS_MAP=( ["up"]="" ["down"]="-destroy" )
          echo "PLAN_FLAGS=${PLAN_FLAGS_MAP[${{ inputs.action }}]}" >> "$GITHUB_ENV"

      - name: Setup OpenTofu
        uses: ./.github/actions/setup-deploy-tools
        with:
          helmfile: 'false'

      - name: Setup variables
        run: |-
          cat > terraform.tfvars <<EOF
          gcp_project_id="${{ vars.GCP_PROJECT_ID }}"
          gcp_project_number="${{ vars.GCP_PROJECT_NUMBER }}"
          gcp_zone="${{ vars.GCP_ZONE }}"
          gcp_gke_cluster_name="${{ vars.GCP_GKE_CLUSTER_NAME }}"
          github_pat="${{ secrets.PAT }}"
          cloudflare_api_token="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          aes_key="${{ secrets.AES_KEY }}"
          cloudflare_zone_id="${{ vars.CLOUDFLARE_ZONE_ID }}"
          EOF

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project-id: ${{ vars.GCP_PROJECT_ID }}
          project-number: ${{ vars.GCP_PROJECT_NUMBER }}

      - name: Tofu Init
        run: tofu init -input=false

      # The logged plan (a destroy plan for down) is saved and applied as is
      - name: Tofu Plan
        run: tofu plan -input=false $PLAN_FLAGS -out=tfplan

      - name: Tofu Apply
        run: tofu apply -input=false tfplan
