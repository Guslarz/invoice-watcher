name: Infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: Action (up, down)
        type: choice
        required: true
        default: up
        options:
          - up
          - down
      environment:
        description: Environment (dev)
        type: choice
        required: true
        default: dev
        options:
          - dev

jobs:
  opentofu:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./devops/infrastructure/environments/${{ github.event.inputs.environment }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.5'

      - name: Setup variables
        run: |-
          cat > terraform.tfvars <<EOF
          gcp_project_id="${{ vars.GCP_PROJECT_ID }}"
          github_pat="${{ secrets.GITHUB_PAT }}"
          EOF

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-actions@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Tofu Init
        run: tofu init -input=false

      - name: Tofu Plan
        run: tofu plan -input=false

      - name: Tofu Apply or Destroy
        if: ${{ github.event.inputs.action == 'up' }}
        run: tofu apply -auto-approve -input=false

      - name: Tofu Destroy
        if: ${{ github.event.inputs.action == 'down' }}
        run: tofu destroy -auto-approve -input=false
