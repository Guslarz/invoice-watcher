name: Setup deployment tools
description: OpenTofu, helmfile, helm and the helm-diff plugin - the single place of their versions

inputs:
  tofu:
    description: Install OpenTofu
    default: 'true'
  helmfile:
    description: Install helmfile, helm and the helm-diff plugin
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup OpenTofu
      if: ${{ inputs.tofu == 'true' }}
      uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      with:
        tofu_version: '1.12.5'

    # Installs only (helmfile version); the tools stay on PATH for the following steps
    - name: Setup helmfile
      if: ${{ inputs.helmfile == 'true' }}
      uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
      with:
        helmfile-version: v1.7.3
        helm-version: v4.2.3
        helm-plugins: https://github.com/databus23/helm-diff@v3.15.11
        helmfile-args: version
