name: Setup Gradle
description: Java (Temurin 25) and Gradle for the build

inputs:
  gradle:
    description: Set up Gradle as well ('false' for a job whose own Gradle action does it)
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Setup Gradle
      if: ${{ inputs.gradle == 'true' }}
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
