name: Setup Gradle
description: Java (Temurin 25) and Gradle for the build

inputs:
  gradle:
    description: Set up Gradle as well ('false' for a job whose own Gradle action does it)
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: 25

    - name: Setup Gradle
      if: ${{ inputs.gradle == 'true' }}
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
