services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - '9092:9092'
      - '9093:9093'
    env_file: ../../deployments/k8s-apps/apps/kafka/overlays/dev/config/.env
    environment:
      # the app runs on the host, not in the cluster
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    deploy:
      resources:
        limits:
          memory: "500m"
          cpus: "1"
