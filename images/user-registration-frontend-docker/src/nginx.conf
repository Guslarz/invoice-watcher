events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /actuator/ { return 404; }
    location /api/ { return 404; }
    location /oauth2/ { return 404; }
    location /login/oauth2/ { return 404; }
    location ~* \.(js|css)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
