apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-registration
spec:
  parentRefs:
    - name: external-http
      namespace: cluster-init
  hostnames:
    - register.@domain@
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /oauth2
        - path:
            type: PathPrefix
            value: /login/oauth2
      backendRefs:
        - name: user-registration-backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: user-registration-frontend
          port: 8080
